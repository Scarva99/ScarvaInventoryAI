<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='18' height='18' rx='3' fill='%231b6c80'/%3E%3Cpath d='M9 8h6M12 8v8M9 16h6' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside class="side" id="side">
  <a class="brand" href="#/panoramica">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 1v3M12 1v3M16 1v3M8 20v3M12 20v3M16 20v3M1 8h3M1 12h3M1 16h3M20 8h3M20 12h3M20 16h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="4" y="4" width="16" height="16" rx="2.5" fill="currentColor"/><path d="M9 8.5h6M12 8.5v7M9 15.5h6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span class="brand-text"><strong>Inventario AI</strong><span id="scope">Questo PC</span></span>
  </a>
  <nav id="nav" aria-label="Sezioni"></nav>
</aside>

<header class="top">
  <button class="menu-btn" id="menu" aria-label="Apri il menu" aria-expanded="false"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  <label class="search">
    <span class="sr">Cerca in tutto l'inventario</span>
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Cerca un modello, una skill, un plugin..." autocomplete="off" spellcheck="false">
    <kbd>Ctrl K</kbd>
  </label>
</header>

<main class="sheet" id="sheet"><div class="canvas" id="view"></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog class="dlg" id="gplan" aria-labelledby="gplan-title"></dialog>
<script src="app.js"></script>
</body>
</html>
